name: Monitor cranes & publish app
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Send a TEST notification to my iPhone'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: crane-watch
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send test notification (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          topic = os.environ.get("NTFY_TOPIC", "").strip()
          if not topic:
              raise SystemExit("NTFY_TOPIC repository secret is missing")
          req = urllib.request.Request(
              "https://ntfy.sh/" + urllib.parse.quote(topic, safe=""),
              data=b"TEST ONLY: Crane Watch notifications are connected. This is not a real crane activity alert.",
              method="POST",
              headers={"Title": "Crane Watch test", "Priority": "default", "Tags": "white_check_mark"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print("Test notification accepted by ntfy (HTTP", response.status, ").")
          PY
      - name: Retrieve eBird observations and send alerts
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_THRESHOLD: '500'
          RADIUS_KM: '25'
        run: python monitor.py
      - name: Save observation history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if ! git diff --cached --quiet; then git commit -m "Update crane activity [skip ci]" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
